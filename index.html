<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pancake Bunny — Ages</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="age-stone theme-dark">
<div id="bg"></div>

<header id="topbar">
  <div id="title-block">
    <h1>🐰 <span id="bunny-title">Pancake Bunny</span></h1>
    <div id="age-line">Age: <span id="current-age">Stone Age</span></div>
  </div>
  <div id="resources"></div>
  <button id="theme-toggle" title="Toggle dark/light">🌙</button>
</header>

<main>
  <section id="play-area">
    <div id="bunny-stage">
      <div id="bunny-wrap">
        <img id="bunny-img" src="bunny.png" alt="Bunny" draggable="false">
        <div id="click-fx"></div>
        <div id="streak-chip" class="hidden">
          <span class="streak-label">STREAK</span>
          <span id="streak-count">0</span>
          <span id="streak-bonus">+0%</span>
        </div>
      </div>
      <div id="click-stats">
        <div><span class="big" id="per-click">+1</span> per click</div>
        <div><span class="big" id="per-sec">+0</span> per sec</div>
      </div>
    </div>
    <div id="helpers-strip"></div>
    <div id="age-progress-wrap">
      <div id="age-progress-bar"><div id="age-progress-fill"></div></div>
      <div id="age-progress-label">— ready to advance —</div>
    </div>
    <button id="advance-age-btn" class="hidden">Advance to next age</button>
  </section>

  <aside id="side-panel">
    <nav id="tabs">
      <button class="tab active" data-tab="tree">🌳 Skills</button>
      <button class="tab" data-tab="research">🔬 Research</button>
      <button class="tab" data-tab="helpers">🐾 Helpers</button>
      <button class="tab" data-tab="achievements">🏆 Trophies</button>
      <button class="tab" data-tab="skins">🎨 Skins</button>
      <button class="tab" data-tab="settings">⚙️ Settings</button>
    </nav>
    <div class="tab-pane active" id="pane-tree"></div>
    <div class="tab-pane" id="pane-research"></div>
    <div class="tab-pane" id="pane-helpers"></div>
    <div class="tab-pane" id="pane-achievements"></div>
    <div class="tab-pane" id="pane-skins"></div>
    <div class="tab-pane" id="pane-settings">
      <h3>Audio</h3>
      <label class="row"><span>Click sounds</span><input type="checkbox" id="set-sound" checked></label>
      <label class="row"><span>Volume</span><input type="range" id="set-volume" min="0" max="100" value="40"></label>
      <h3>Visuals</h3>
      <label class="row"><span>Dark mode</span><input type="checkbox" id="set-dark" checked></label>
      <label class="row"><span>Reduce motion</span><input type="checkbox" id="set-no-motion"></label>
      <h3>Save</h3>
      <button id="set-save">💾 Manual save</button>
      <button id="set-export">📤 Export to clipboard</button>
      <button id="set-import">📥 Import from clipboard</button>
      <button id="set-reset" class="danger">🔥 Hard reset</button>
      <p class="muted">Auto-saves every 5 seconds.</p>
      <div id="debug-section" class="hidden">
        <hr>
        <h3>🔧 Debug</h3>
        <div id="debug-grid"></div>
      </div>
    </div>
  </aside>
</main>

<div id="toasts"></div>
<audio id="click-sfx" src="click.mp3" preload="auto"></audio>

<script src="game.js"></script>
</body>
</html>
